# scripts/dev-branch.conf — la déclaration de vectorz pour le lanceur universel.
# Fiche 20260917162000501 · recette recipes/lanceur-dev-universel.md · outil tools/launcher/
#
#   pnpm dev:branch                      la carte de la méthode, servie par CETTE branche
#   pnpm dev:branch <branche>            idem pour une autre branche (arbre de run dédié si besoin)
#   pnpm dev:branch --as moniteur        le Moniteur de supervision (vite) de cette branche
#   pnpm dev:branch stop [<branche>]     n'arrête que ce stack — jamais ton Moniteur perso
#
# Vérifier : bash scripts/dev-branch.sh doctor

# 1. LANCER — le tableau de bord (ezk dashboard, ex ezk:map) ; le lanceur ouvre le navigateur
#    lui-même (--open), pas ezk-map.
DEV_START='EZK_MAP_NO_OPEN=1 pnpm --dir products/mega-city ezk dashboard'
DEV_PORT_ENV='EZK_MAP_PORT'
# Variante : le Moniteur de supervision (vite lit PORT). Sans son daemon, l'écran charge mais
# ses appels /api échouent : le daemon est une autre appli (voir « Suite » de la fiche).
DEV_START__moniteur='pnpm --dir products/cop1/packages/web dev --host 127.0.0.1'

# 2. ARRÊTER — rien de plus que ce que le lanceur fait déjà (groupe de process).
DEV_STOP=''

# 3. ÉTAT DE DÉPART
DEV_STATE='sans objet — la carte et le Moniteur (sans daemon) ne lisent que le dépôt de leur branche, aucune donnée de test'

# 4. PÉRIMÈTRE D'ISOLATION
DEV_ISOLATION='un port libre propre à chaque branche, jamais 5173 ni 4242 (Moniteur et daemon perso) ; rien n est écrit ; NON isolé : le dépôt (lu seulement) et le navigateur'

# 5. PORTS
DEV_PORT_BASE=4173
DEV_RESERVED_PORTS='5173 4242'

# Réglages
DEV_ENV_FILES=''                    # vectorz n a pas de .env à reporter
DEV_TREES_DIR='.claude/worktrees'   # déjà ignoré par git et par biome
DEV_CMD_HINT='pnpm dev:branch'
