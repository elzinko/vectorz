# scripts/dev-branch.conf — la déclaration de vectorz pour le lanceur universel.
# Fiche 20260917162000501 · recette recipes/lanceur-dev-universel.md · outil tools/launcher/
#
#   pnpm dev:branch                      mission control, servi par CETTE branche
#   pnpm dev:branch <branche>            idem pour une autre branche (arbre de run dédié si besoin)
#   pnpm dev:branch stop [<branche>]     n'arrête que ce stack — jamais ton mission control perso
#
# Vérifier : bash scripts/dev-branch.sh doctor

# 1. LANCER — mission control, le seul écran (ADR-086 amendé le 2026-11-02) : sa page sur le port
#    que donne le lanceur, son daemon sur le suivant. La page web de la méthode est retirée.
DEV_START='COP1_WEB_PORT=$PORT COP1_DAEMON_PORT=$((PORT + 1)) bash scripts/cop1-dev.sh'

# 2. ARRÊTER — rien de plus que ce que le lanceur fait déjà (groupe de process).
DEV_STOP=''

# 3. ÉTAT DE DÉPART
DEV_STATE='sans objet — mission control lit le dépôt de sa branche par ezk, aucune donnée de test'

# 4. PÉRIMÈTRE D'ISOLATION
DEV_ISOLATION='deux ports libres propres à chaque branche (page et daemon), jamais 5273 ni 4343 (mission control perso) ; NON isolé : le dépôt (un pouce posé l écrit, par ezk) et le navigateur'

# 5. PORTS
DEV_PORT_BASE=4173
DEV_RESERVED_PORTS='5273 4343'

# Réglages
DEV_ENV_FILES=''                    # vectorz n a pas de .env à reporter
DEV_TREES_DIR='.claude/worktrees'   # déjà ignoré par git et par biome
DEV_CMD_HINT='pnpm dev:branch'
