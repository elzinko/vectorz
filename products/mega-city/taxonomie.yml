# La taxonomie du catalogue — LES TROIS ÉTAGES (ADR-0039, lot 2 du plan, PO 2026-08-23).
#
# UN SEUL fichier de classification (verdict du panel adverse : jamais de frontmatter
# éparpillé). Le compilateur de la carte VALIDE ce document : chaque skill et chaque
# agent du catalogue DOIT avoir un étage — un oubli, un id inconnu ou un doublon fait
# échouer la régénération.
#
# Les trois étages (+ la fabrique) :
#   methode      — l'instance scrum : cérémonies, rôles, artefacts (bandes internes ADR-0020)
#   modules      — hors méthode, activables (« modules » à la BMAD, PO 2026-08-24) ;
#                  par famille : hote-llm, github, observabilite, techno, overlay
#   librairie    — la fabrique de la méthode elle-même (méta)
# (Le MOTEUR — rules/bundles/profiles/bind — n'a pas de skills : c'est le code et
#  les objets qu'il compose ; il est documenté par ADR-0039, pas listé ici.)
#
# Rangements actés par le PO le 2026-08-23 : commits → techno (« la partie commit est
# un outillage ») · archive → hôte LLM (skill ET agent exécutant) · start → méthode
# (« une étape liée au sprint ») · backlog → méthode (artefact) · codex → GitHub ·
# supervision-* → observabilité · ezk-ezk + steward + chef → librairie · vz-product-builder
# → overlay (le premier vivant) · ezk-pr → module github (2026-08-24).

etages:
  methode:
    skills:
      - ezk-backlog
      - ezk-bug
      - ezk-product-build
      - ezk-release
      - ezk-retro
      - ezk-scout
      - ezk-sprint
    agents:
      - ezk-architect
      - ezk-dev
      - ezk-pm
      - ezk-qa
      - ezk-reviewer
  modules:
    familles:
      hote-llm:
        skills: [ezk-archive]
        agents: [ezk-archive]
      github:
        skills: [ezk-codex, ezk-pr]  # la PR est un mécanisme GitHub, pas une cérémonie (PO 2026-08-24)
      observabilite:
        skills: [supervision-analyze, supervision-demo]
      techno:
        skills:
          - ezk-apk
          - ezk-article
          - ezk-ci
          - ezk-commits
          - ezk-design-system
          - ezk-device
          - ezk-diagram
          - ezk-docker
          - ezk-npm-scripts
          - ezk-preview
          - ezk-readme
      overlay:
        skills: [vz-product-builder]
  librairie:
    skills: [ezk-ezk, ezk-chef]
    agents: [ezk-steward, ezk-chef]

# Les COMMANDES DE TERMINAL (`ezk <domaine> <verbe>`, ezk-manifest.yml) — fiche 20261114131613129.
# Une ligne par domaine ; une commande précise (« <domaine> <verbe> ») peut dévier de son domaine.
# Valeur : methode | librairie | modules/<famille>, le vocabulaire des étages ci-dessus (« hôte »
# reste la famille hote-llm, pas un étage). COMPLÉTUDE exigée, comme pour les skills : une commande
# du manifeste sans étage, ou une clé qui n'est ni un domaine ni une commande du manifeste, fait
# échouer `ezk help --json` et la gate. Premier rangement : build du 2026-11-15, à amender par le PO.
commandes:
  # méthode — le cœur Scrum : backlog, « prête », board, sprint, revue, rétro, version, run autonome
  backlog: methode
  board: methode
  dor: methode
  sprint: methode
  review: methode
  retro: methode
  release: methode
  run: methode
  journal: methode
  scout: methode
  carto: methode
  evidence: methode
  adr: methode
  paths: methode
  now: methode
  # modules — hors méthode, activables, par famille
  pr: modules/github
  forge: modules/github
  ci: modules/github
  config: modules/github
  sessions: modules/hote-llm
  supervision: modules/observabilite
  design: modules/techno
  # librairie — la fabrique de la méthode : loi, règles, graphe, recettes, vues, liens
  law: librairie
  rules: librairie
  graph: librairie
  recipes: librairie
  views: librairie
  docs: librairie
  board maps: librairie  # dérogation : les documents de la méthode elle-même (sa carte)

# Bandes INTERNES à l'étage méthode (ADR-0020, amendée par ADR-0039 : l'ex-bande
# « Outillage » est promue famille de modules ; commits et archive quittent
# l'étage méthode sur décision PO). L'ordre est l'ordre du flux.
bandes:
  ceremonies: [ezk-product-build, ezk-sprint, ezk-retro, ezk-release, ezk-bug, ezk-scout]
  artefacts: [ezk-backlog]
