# Profil global — l'ÉQUIPE COMPLÈTE ezk-*, toolbox **exhaustif**.
# Pour le daily-driver solo, préférer `daily.yml` (curated) —
# `bind-global daily --link` (docs/PROGRAMME-REFONTE.md phase 2).
# `bind-global global --link` matérialise ~/.claude/{skills,agents} en symlink live
# vers mega-city ; il REMPLACE le install.sh de claude-skills (qui installait tout
# le catalogue en global — ADR-0006, switchover fiche 0024).
#
# Contrairement à un profil par-cible (mobile, desktop…) qui conditionne un SOUS-ENSEMBLE
# à un type d'app, `global` porte TOUT le toolbox : il n'est pas curated, il est exhaustif.
id: global
extends: [base]            # → hérite le socle (bundle base + ezk-archive)
bundles: [base]
# → toute l'équipe ezk-* (8 agents) → installée dans ~/.claude/agents/
#   ezk-archive = le sous-agent de clôture, cible de délégation du skill ezk-archive
#   (skill mince → modèle/effort fixes) ; ici plutôt que dans base pour garder les
#   profils par-cible curated (le socle reste `agents: []`).
#   ezk-chef = le sous-agent du livre de recettes (fiche 20260903134909124 : il manquait).
# Garde : src/__tests__/global-profile-covers-ezk.test.ts — « exhaustif » = tout ezk-* du catalogue.
agents:
  - ezk-architect
  - ezk-archive
  - ezk-chef
  - ezk-pm
  - ezk-qa
  - ezk-reviewer
  - ezk-steward
  - ezk-dev
# → tout le catalogue de skills ezk-* (22) → installés dans ~/.claude/skills/
skills:
  - ezk-apk
  - ezk-archive
  - ezk-article
  - ezk-backlog
  - ezk-bug
  - ezk-chef
  - ezk-ci
  - ezk-codex
  - ezk-commits
  - ezk-design-system
  - ezk-device
  - ezk-diagram
  - ezk-docker
  - ezk-ezk
  - ezk-npm-scripts
  - ezk-pr
  - ezk-preview
  - ezk-product-build
  - ezk-readme
  - ezk-retro
  - ezk-scout
  - ezk-sprint
# → les slash-commands du catalogue (commands/<id>.md) → installées dans ~/.claude/commands/
#   (fiche 20260816151112162 : /ezk-help était copiée à la main, donc absente d'une machine neuve).
#   Garde : src/__tests__/global-profile-covers-ezk.test.ts — toute commande du catalogue est ici.
commands:
  - ezk-help
interactions: []           # → règles d'interaction entre agents
