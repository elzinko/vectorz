project:
  name: cop1
  path: "."

daemon:
  port: 4242

sprint:
  default_duration_hours: 2

resources:
  ram_budget_night_gb: 48
  ram_budget_day_gb: 20
  suspension_threshold_percent: 75
  polling_interval_ms: 1000

# LLM routing — adjust model names to match your `ollama list`
# REMINDER: see features/REMINDER-llm-models.md for recommended models
llm_routing:
  default: "llama3.2"
  dev: "llama3.2"
  reviewer: "llama3.2"

llm_fallback:
  default: "llama3.2"

git:
  auto_merge: false

blocage_rules: {}

schedule:
  auto_start: []

# fiche 0031 (ADR-028) — lecteur de journal .supervision/runs/ (mode moniteur).
# Dormant par défaut : watch_roots vide = aucun fs.watch, aucune surveillance.
supervision:
  watch_roots: []
  presumed_dead_after_min: 5
  # ADR-035 — abandon orphelin (optionnel)
  # abandon_command: ["pnpm", "--dir", "products/mega-city", "supervision:abandon"]
  # fiche 0063 — ancrage depuis le Moniteur (optionnel ; défaut = capacité dormante)
  # link_command: ["pnpm", "--dir", "products/mega-city", "supervision:link"]
  # registry_add_command: ["pnpm", "--dir", "products/mega-city", "supervision:registry-add"]
  # bind_command: ["pnpm", "--dir", "products/mega-city", "lawgiver", "bind", "default"]
