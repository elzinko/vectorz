name: check-links

# Le workflow CI principal (ci.yml) skippe **/*.md par frugalité (fiche 0055) : une PR
# doc-only ne le déclenche donc PAS — et c'est justement là que les liens cassent (une
# fiche descendue dans done/ par `ship`, une profondeur relative fausse). Ce workflow
# featherweight attrape ces PR-là : bash PUR, aucun `pnpm install`, ~quelques secondes,
# coût Actions négligeable. Fiche 0101 — « un contrôle que personne ne lance ne protège de rien ».
#
# Il porte DEUX garde-fous markdown-only, pour la même raison :
#   1. liens relatifs cassés ;
#   2. numéros d'ADR attribués deux fois (PR #160).
# Le second est arrivé ici par un retour Codex qui a mis le doigt sur l'ironie : un ADR
# neuf est un fichier `.md`, donc `ci.yml` l'ignore — le garde-fou serait resté AVEUGLE
# au cas exact pour lequel il existe. Deux étapes dans UN job : pas de runner en plus.
on:
  pull_request:
    branches: [main]
    paths: ['**/*.md']
  push:
    branches: [main]
    paths: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: garde-fous markdown (liens relatifs + numéros d'ADR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Source de vérité unique : les mêmes scripts tournent aussi dans la gate locale/CI
      # (`pnpm --dir products/mega-city test:scripts`). Ici, sans install, pour couvrir le md-only.
      - name: check-links (2 racines)
        run: bash products/mega-city/bin/test-links-repo.sh

      # Un ADR neuf = un fichier .md → seul CE workflow se déclenche. C'est donc ICI, et
      # nulle part ailleurs, que la collision de numéro peut être attrapée.
      #
      # Portée exacte (revue Codex, PR #160) — ne pas surestimer ce que ça garantit :
      #   · sur une PR, GitHub évalue la FUSION avec main → un numéro déjà pris sur main
      #     est vu AVANT le merge ;
      #   · MAIS une PR verte n'est pas re-jouée quand main avance (pas de branch
      #     protection : plan Free). Deux PR parties du même point peuvent donc passer.
      #   · Le filet est alors le déclencheur `push` sur main ci-dessus : la collision
      #     rougit main dans la minute. Prévention impossible sans file d'attente de
      #     merge ; la garantie tenue est qu'une collision NE DORT PAS.
      - name: numéros d'ADR (aucune collision neuve)
        run: bash products/mega-city/bin/test-adr-ids-repo.sh

  # 3e garde-fou markdown-only : le SCHÉMA des fiches (statuts/enums validés). Une fiche au
  # `status:` invalide est un fichier .md → `ci.yml` l'ignore (paths-ignore **/*.md) ; sans ce
  # job, la bascule bloquante de `check-fiches --strict` (fiche 652) ne verrait JAMAIS le cas
  # qu'elle cible — une PR doc-only (retour Codex, PR #233). Le validateur est en TS (tsx),
  # donc ce job fait un `pnpm install` : il est SÉPARÉ du job bash ci-dessus, qui reste
  # featherweight. Coût Actions : vectorz est public (runners gratuits).
  fiche-schema:
    name: schéma des fiches (statuts validés, --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validateur de statut (bloquant)
        run: pnpm --dir products/mega-city exec tsx bin/check-fiches.ts --strict
