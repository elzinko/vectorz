name: CI

on:
  # PR-only gate (no redundant re-run on push:main — the PR already validated it).
  # Docs-only changes (markdown anywhere) skip CI entirely: a run fires only when a
  # non-.md file changed, so backlog/ADR/session grooming costs zero Actions minutes.
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# One run per PR ref; pushing new commits cancels the previous in-flight run to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · build · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # The web package (@cop1/web) is a Vite app excluded from the root `build`,
      # `test`, and `lint` scripts, so its own typecheck, build, and tests run here
      # to close that CI-coverage gap — a type, bundler, or test failure in
      # packages/web would otherwise slip through the pipeline.
      - name: Typecheck (web)
        run: pnpm --filter @cop1/web typecheck

      - name: Build (web)
        run: pnpm --filter @cop1/web build

      - name: Test (web)
        run: pnpm --filter @cop1/web test

      # Tests that spin up throwaway git repos set their own LOCAL identity, so
      # no global git config is needed here (proves the tests are hermetic).
      # (Root test run includes tools/boundary — the cross-import guardrail, ADR-027 §5.)
      - name: Test
        run: pnpm test

      # Separability guardrails (ADR-027 §5 / ADR-021): each product must build and
      # test ALONE — mega-city's host-agnosticity is proven mechanically, not asserted.
      - name: Typecheck (mega-city, standalone)
        run: pnpm --filter mega-city typecheck

      - name: Test (mega-city, standalone)
        run: pnpm --filter mega-city test

      # DoD exécutables en bash (classification des branches post-squash, contrat du
      # portier de clôture, garde anti-faux-positif main/origin-main, anneau FIFO du
      # handoff, unicité du gabarit, régénération de l'index backlog). Ils existaient
      # mais se lançaient à la main : rien ne garantissait qu'ils soient encore verts.
      # Hermétiques comme les tests TS — fixtures jetables en mktemp -d, identité git
      # locale, et `gh` non authentifié sur le runner est un cas géré (repo local-only).
      - name: Test scripts (mega-city, bash)
        run: pnpm --filter mega-city test:scripts

  # Fiche 0041 — banc cobaye Pareto (mécanique dogfood + Moniteur Playwright).
  # Job séparé : Playwright/Chromium n'alourdit pas le chemin lint·build·test.
  cobaye-smoke:
    name: cobaye smoke (0041)
    # Gated (fiche 0055 frugalité) : Playwright/Chromium refait install+build avant le
    # smoke, c'est le job le plus lourd. Il ne part QUE sur déclenchement manuel
    # (workflow_dispatch) ou si la PR porte le label `smoke-test` — pas sur chaque PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build (web)
        run: pnpm --filter @cop1/web build

      - name: Cobaye smoke
        run: pnpm cobaye:smoke
