note: >-
  Tranche 1 (fiche 20261002115451315) : chaque fiche posée sur une des cinq étapes
  (idée · prête · en sprint · en revue · livrée), déduites du statut, des branches
  feat/<id>-…, des PR ouvertes et des sessions — aucun objet « sprint » inventé
  (verdict du panel du 2026-08-23). L'absence de gh/remote est un cas de première
  classe : une fiche avec branche reste « en sprint », jamais rétrogradée en silence.
