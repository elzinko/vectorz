    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e7e9ee; --muted: #9aa2b1;
    --p0: #e5484d; --p1: #f5a524; --p2: #5b9bd5; --p3: #6b7280;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-family: "Chakra Petch", sans-serif; font-size: 1.5rem; margin: 0 0 4px; letter-spacing: .01em; }
  .en-clair { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
  .filtres {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .filtres label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
  .filtres select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    min-width: 140px;
  }
  .compteur { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  .grille {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  a.carte {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--prio-color, var(--p3));
    border-radius: 8px;
    padding: 12px 14px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.1s, transform 0.1s;
  }
  a.carte:hover { border-color: #4a5262; transform: translateY(-1px); }
  .carte .id { font-size: 0.72rem; color: var(--muted); font-family: ui-monospace, monospace; }
  .carte .titre { font-weight: 600; margin: 4px 0 8px; line-height: 1.3; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 0.7rem;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.statut-todo { color: var(--todo); border-color: var(--todo); }
  .badge.statut-ready { color: var(--ready); border-color: var(--ready); }
  .badge.statut-in-progress { color: var(--in-progress); border-color: var(--in-progress); }
  .badge.statut-blocked { color: var(--blocked); border-color: var(--blocked); }
  .badge.statut-idea { color: var(--idea); border-color: var(--idea); }
  .badge.statut-shipped { color: var(--shipped); border-color: var(--shipped); }
  .badge.tag { color: var(--muted); border-color: var(--muted); }
  .badge.prio-P0 { color: var(--p0); border-color: var(--p0); }
  .badge.prio-P1 { color: var(--p1); border-color: var(--p1); }
  .badge.prio-P2 { color: var(--p2); border-color: var(--p2); }
  .badge.prio-P3 { color: var(--p3); border-color: var(--p3); }
  .vide { color: var(--muted); padding: 40px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; }
  section.manques {
    margin-top: 32px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;

  section.manques ul { margin: 0; padding-left: 20px; color: var(--muted); line-height: 1.6; }
  section.manques li strong { color: var(--text); }

  /* --- Onglets Board / Plan (fiche 20260825213807501) --- */
  .onglets { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 1px solid var(--border); }
  .onglet {
    background: none; border: 1px solid transparent; border-bottom: none;
    color: var(--muted); font: inherit; font-size: 0.95rem; padding: 8px 16px;
    border-radius: 8px 8px 0 0; cursor: pointer; margin-bottom: -1px;
  }
  .onglet:hover { color: var(--text); }
  .onglet[aria-selected="true"] {
    color: var(--text); background: var(--panel);
    border-color: var(--border); border-bottom-color: var(--panel); font-weight: 600;
  }
  .onglet:focus-visible { outline: 2px solid var(--p2); outline-offset: 2px; }
  [role="tabpanel"][hidden] { display: none; }

  /* Encart pédagogique de l'onglet Plan */
  .encart {
    margin: 0 0 24px; padding: 16px 18px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; max-width: 82ch;
  }
  .encart h2 { font-size: 1rem; margin: 0 0 10px; }
  .encart .rappel { margin: 0 0 14px; color: var(--muted); line-height: 1.6; }
  .encart .rappel b { color: var(--text); }
  .encart .signal { display: flex; flex-direction: column; gap: 10px; }
  .encart .ligne-signal { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .encart .lab { font-size: 0.8rem; color: var(--muted); min-width: 15ch; }
  .encart .rien { color: var(--muted); font-size: 0.85rem; }
  .encart .mini {
    display: inline-flex; gap: 8px; align-items: baseline;
    background: var(--bg); border: 1px solid var(--border);
    border-left: 3px solid var(--prio-color, var(--p3));
    border-radius: 6px; padding: 5px 10px; text-decoration: none; color: var(--text);
  }
  .encart .mini:hover { border-color: #4a5262; }
  .encart .mini .id { font-family: ui-monospace, monospace; font-size: 0.72rem; color: var(--muted); }
  .encart .mini .t { font-size: 0.85rem; }
  .plan-outils { margin: 0 0 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .plan-outils label { display: inline-flex; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
  .plan-compteur { color: var(--muted); font-size: 0.85rem; }

  /* Encart « ce qui a bougé » (écart plan, fiche 20260828165644386) */
  .delta-compteur { font-size: 0.9rem; color: var(--muted); margin: 2px 0 12px; line-height: 1.5; }
  .delta-compteur b { color: var(--text); }
  .delta-liste { display: flex; flex-direction: column; gap: 6px; }
  .delta-item { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .delta-badge {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.02em;
    border-radius: 4px; padding: 1px 7px; border: 1px solid var(--border); color: var(--muted);

  .delta-badge.hors { color: var(--p0); border-color: var(--p0); font-weight: 600; }
  .delta-item .st { font-size: 0.72rem; color: var(--muted); }

  /* Couloirs = sections de PLAN.md */
  .couloir { margin: 0 0 26px; }
  .couloir > h3 {
    font-size: 1.02rem; margin: 0 0 2px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);

(function () {
  var data = window.EZK_AVANCEMENT || { actives: [], milestones: [], filtres: { statuts: [], priorites: [], produits: [], labels: [], milestones: [] } };
  var actives = data.actives || [];

  // Rang de tri d'affichage — même ordre que STATUTS/PRIOS côté cœur (avancement-data.ts).
  var STATUT_RANK = ['idea', 'ready', 'in-progress', 'blocked', 'shipped'];
  var PRIO_RANK = ['P0', 'P1', 'P2', 'P3'];
  var rankIn = function (arr, v) {
    var i = arr.indexOf(v);
    return i === -1 ? arr.length : i;
  };

  function uniq(xs) {
    return Array.from(new Set(xs.filter(Boolean))).sort();
  }

  function fillSelect(select, values) {
    values.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  }

  var selStatut = document.getElementById('f-statut');
  var selType = document.getElementById('f-type');
  var selMilestone = document.getElementById('f-milestone');
  var selProduit = document.getElementById('f-produit');
  var selLabel = document.getElementById('f-label');

  fillSelect(selStatut, (data.filtres && data.filtres.statuts) || uniq(actives.map(function (f) { return f.status; })));
  fillSelect(selType, uniq(actives.map(function (f) { return f.type; })));
  fillSelect(selMilestone, (data.filtres && data.filtres.milestones) || uniq(actives.map(function (f) { return f.milestone; })));
  fillSelect(selProduit, (data.filtres && data.filtres.produits) || uniq(actives.map(function (f) { return f.product; })));
  fillSelect(selLabel, (data.filtres && data.filtres.labels) || uniq(actives.reduce(function (acc, f) { return acc.concat(f.labels || []); }, [])));

  var grille = document.getElementById('grille');
  var compteur = document.getElementById('compteur');

  // Sécurité (revue P0) : on construit le DOM par éléments + textContent, JAMAIS
  // innerHTML avec des données de fiche (titre, statut… = texte libre du front-matter).
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // Valeur mise en NOM DE CLASSE CSS → slug (jamais de texte libre brut en classe).
  function slug(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9_-]/g, '-'); }

  function carteHtml(f) {
    var a = document.createElement('a');
    a.className = 'carte';
    a.href = '../../' + f.file;
    a.addEventListener('click', function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1) return; // laisse ouvrir la source en nouvel onglet
      ev.preventDefault();
      openFiche(f);
    });
    a.style.setProperty('--prio-color', 'var(--p' + slug(f.priority ? f.priority.replace('P', '') : '3') + ')');
    a.appendChild(el('div', 'id', f.id));
    a.appendChild(el('div', 'titre', f.title));
    var badges = el('div', 'badges');
    badges.appendChild(el('span', 'badge statut-' + slug(f.status), f.status));
    badges.appendChild(el('span', 'badge prio-' + slug(f.priority || 'P3'), f.priority || '—'));
    badges.appendChild(el('span', 'badge', f.type));
    if (f.epic) badges.appendChild(el('span', 'badge', '⤷ ' + f.epic));
    (f.labels || []).forEach(function (l) { badges.appendChild(el('span', 'badge tag', '#' + l)); });
    a.appendChild(badges);
    return a;
  }

  function render() {
    var fStatut = selStatut.value;
    var fType = selType.value;
    var fMilestone = selMilestone.value;
    var fProduit = selProduit.value;
    var fLabel = selLabel.value;

    var filtered = actives.filter(function (f) {
      return (!fStatut || f.status === fStatut) &&
        (!fType || f.type === fType) &&
        (!fMilestone || f.milestone === fMilestone) &&
        (!fProduit || f.product === fProduit) &&
        (!fLabel || (f.labels || []).indexOf(fLabel) !== -1);
    });

    // Tri d'affichage priorité puis statut (présentation seule, la donnée compilée
    // ne bouge pas — le compilateur, lui, trie priorité puis id, fiche AC lot 0).
    filtered = filtered.slice().sort(function (a, b) {
      var byPrio = rankIn(PRIO_RANK, a.priority) - rankIn(PRIO_RANK, b.priority);
      if (byPrio !== 0) return byPrio;
      var byStatut = rankIn(STATUT_RANK, a.status) - rankIn(STATUT_RANK, b.status);
      if (byStatut !== 0) return byStatut;
      return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
    });

    grille.innerHTML = '';
    if (filtered.length === 0) {
      var vide = document.createElement('div');
      vide.className = 'vide';
      vide.textContent = 'Aucune fiche pour ces filtres.';
      grille.appendChild(vide);
    } else {
      filtered.forEach(function (f) { grille.appendChild(carteHtml(f)); });
    }
    compteur.textContent = filtered.length + ' fiche(s) sur ' + actives.length + ' active(s) — ' +
      (data.tirables || 0) + ' tirable(s), ' + ((data.milestones || []).length) + ' milestone(s).';
  }

  // --- Détail d'une fiche au clic (fiche 20260826225817193) ---
  // Le clic sur une carte ouvre un panneau LISIBLE au lieu de naviguer vers le .md brut.
  // Rendu du corps en DOM + textContent, JAMAIS innerHTML sur du texte de fiche (anti-XSS).
  var overlay = el('div', 'fiche-overlay');
  var modal = el('div', 'fiche-modal');
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  var mStyle = document.createElement('style');
  mStyle.textContent =
    '.fiche-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100;padding:3vh 3vw;overflow:auto}' +
    '.fiche-overlay.open{display:block}' +
    '.fiche-modal{max-width:min(1080px,94vw);margin:0 auto;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:20px 26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}' +
    '.fiche-modal .fiche-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}' +
    '.fiche-modal h2.fiche-titre{font-size:1.2rem;margin:0;flex:1}' +
    '.fiche-modal .fiche-close{border:1px solid var(--border);background:transparent;color:inherit;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;flex:none}' +
    '.fiche-modal .fiche-meta{margin:2px 0 8px}' +
    '.fiche-modal .fiche-src{font-size:.8rem;margin-bottom:10px;display:inline-block;color:var(--p2)}' +
    '.fiche-modal .fiche-body{border-top:1px solid var(--border);padding-top:12px;line-height:1.6;overflow-wrap:anywhere}' +
    '.fiche-modal .fiche-body h3{font-size:1.02rem;margin:16px 0 4px}' +
    '.fiche-modal .fiche-body ul{margin:4px 0 6px 1.2rem;padding:0}' +
    '.fiche-modal .fiche-body p{margin:7px 0}' +
    '.fiche-modal .fiche-body pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow:auto;font-size:.82rem}' +
    '.fiche-modal .fiche-loading{color:var(--muted);font-style:italic}';
  document.head.appendChild(mStyle);

  function closeFiche() { overlay.classList.remove('open'); modal.textContent = ''; }
  overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeFiche(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeFiche(); });

  // Miroir EXACT de products/mega-city/src/core/markdown-lite.ts (parseur PUR + testé) — la
  // page statique ne peut pas importer le module ; dette assumée (comme la carte LA LOI).
  // Rendu des blocs en DOM + textContent UNIQUEMENT (anti-XSS). CRLF-safe.
  function stripInline(s) { return String(s).replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`]+/g, ''); }
  function parseBlocks(md) {
    var lines = String(md).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '').split(/\r?\n/);
    var blocks = [], code = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^```/.test(line)) { if (code) { blocks.push({ kind: 'code', text: code.join('\n') }); code = null; } else { code = []; } continue; }
      if (code) { code.push(line); continue; }
      var h = line.match(/^#{1,6}\s+(.*)/);
      if (h) { blocks.push({ kind: 'h', text: stripInline(h[1]) }); continue; }
      var li = line.match(/^\s*[-*]\s+(.*)/);
      if (li) { blocks.push({ kind: 'li', text: stripInline(li[1]) }); continue; }
      if (line.trim() === '') continue;
      blocks.push({ kind: 'p', text: stripInline(line.replace(/^>\s?/, '')) });
    }
    if (code) blocks.push({ kind: 'code', text: code.join('\n') });
    return blocks;
  }
  function renderBlocks(container, md) {
    var ul = null;
    parseBlocks(md).forEach(function (b) {
      if (b.kind === 'li') { if (!ul) { ul = el('ul'); container.appendChild(ul); } ul.appendChild(el('li', null, b.text)); return; }
      ul = null;
      if (b.kind === 'h') container.appendChild(el('h3', null, b.text));
      else if (b.kind === 'code') { var pre = el('pre'); pre.appendChild(el('code', null, b.text)); container.appendChild(pre); }
      else container.appendChild(el('p', null, b.text));
    });
  }

  function openFiche(f) {
    modal.textContent = '';
    var head = el('div', 'fiche-head');
    head.appendChild(el('h2', 'fiche-titre', f.title));
    var close = el('button', 'fiche-close', '✕');
    close.setAttribute('aria-label', 'Fermer');
    close.addEventListener('click', closeFiche);
    head.appendChild(close);
    modal.appendChild(head);

    var meta = el('div', 'fiche-meta badges');
    meta.appendChild(el('span', 'badge', f.id));
    meta.appendChild(el('span', 'badge statut-' + slug(f.status), f.status));
    meta.appendChild(el('span', 'badge prio-' + slug(f.priority || 'P3'), f.priority || '—'));
    meta.appendChild(el('span', 'badge', f.type));
    if (f.epic) meta.appendChild(el('span', 'badge', '⤷ ' + f.epic));
    if (f.pr) meta.appendChild(el('span', 'badge', f.pr));
    modal.appendChild(meta);

    var src = document.createElement('a');
    src.className = 'fiche-src';
    src.href = '../../' + f.file;
    src.target = '_blank';
    src.rel = 'noopener';
    src.textContent = '↗ ouvrir le fichier (' + f.file + ')';
    modal.appendChild(src);

    var bodyEl = el('div', 'fiche-body');
    bodyEl.appendChild(el('p', 'fiche-loading', 'Chargement…'));
    modal.appendChild(bodyEl);
    overlay.classList.add('open');
    modal.scrollTop = 0;

    fetch('../../' + f.file).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (md) {
      bodyEl.textContent = '';
      renderBlocks(bodyEl, md);
    }).catch(function (e) {
      bodyEl.textContent = '';
      bodyEl.appendChild(el('p', 'fiche-loading', 'Impossible de charger la fiche (' + e.message + '). Ouvre le fichier via le lien ci-dessus.'));
    });
  }

  [selStatut, selType, selMilestone, selProduit, selLabel].forEach(function (s) {
    s.addEventListener('change', render);
  });
  render();
})();
</script>

<script>
// Onglet « Plan » (fiche 20260825213807501) : rend window.EZK_PLAN, compilé depuis
// features/PLAN.md + les fiches. Même discipline anti-XSS que le board : DOM par
// éléments + textContent, JAMAIS innerHTML sur du texte de fiche ou de plan.
(function () {
  var plan = window.EZK_PLAN || { lanes: [], head: null, blockedAhead: [], unresolved: [], counts: {} };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function slug(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9_-]/g, '-'); }
  function prioVar(p) { return 'var(--p' + slug(p ? String(p).replace('P', '') : '3') + ')'; }
  // Nettoie l'emphase markdown pour l'affichage de l'intention (texte simple, pas de rendu MD).
  function cleanText(s) { return String(s == null ? '' : s).replace(/[*~`]+/g, ''); }

  // --- Bascule d'onglets, accessible (ARIA tablist + flèches clavier) ---
  var tabBoard = document.getElementById('onglet-board');
  var tabPlan = document.getElementById('onglet-plan');
  var panBoard = document.getElementById('vue-board');
  var panPlan = document.getElementById('vue-plan');
  function activer(tab, focus) {
    var toPlan = tab === tabPlan;
    tabPlan.setAttribute('aria-selected', String(toPlan));
    tabBoard.setAttribute('aria-selected', String(!toPlan));
    tabPlan.tabIndex = toPlan ? 0 : -1;
    tabBoard.tabIndex = toPlan ? -1 : 0;
    panPlan.hidden = !toPlan;
    panBoard.hidden = toPlan;
    if (focus) tab.focus();
  }
  tabBoard.addEventListener('click', function () { activer(tabBoard, false); });
  tabPlan.addEventListener('click', function () { activer(tabPlan, false); });
  [tabBoard, tabPlan].forEach(function (t) {
    t.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
        ev.preventDefault();
        activer(t === tabBoard ? tabPlan : tabBoard, true);
      }
    });
  });

  // --- Cartes (réutilisent le design du board) ---
  function planCarte(c) {
    if (!c.found) {
      var d = el('div', 'carte introuvable');
      d.style.setProperty('--prio-color', 'var(--p3)');
      d.appendChild(el('div', 'id', c.id));
      d.appendChild(el('div', 'titre', 'introuvable dans features/'));
      return d;
    }
    var a = document.createElement('a');
    a.className = 'carte' + (c.closed ? ' livree' : '');
    a.href = '../../' + c.file;
    a.style.setProperty('--prio-color', prioVar(c.priority));
    a.appendChild(el('div', 'id', c.id));
    a.appendChild(el('div', 'titre', c.title));
    var badges = el('div', 'badges');
    badges.appendChild(el('span', 'badge statut-' + slug(c.status), c.status));
    badges.appendChild(el('span', 'badge prio-' + slug(c.priority || 'P3'), c.priority || '—'));
    if (c.epic) badges.appendChild(el('span', 'badge', '⤷ ' + c.epic));
    a.appendChild(badges);
    return a;
  }
  function miniCarte(c) {
    if (!c.found) return el('span', 'rien', c.id + ' (introuvable)');
    var a = document.createElement('a');
    a.className = 'mini';
    a.href = '../../' + c.file;
    a.style.setProperty('--prio-color', prioVar(c.priority));
    a.appendChild(el('span', 'id', c.id));
    a.appendChild(el('span', 't', c.title));
    return a;
  }

  // --- Encart pédagogique ---
  var encart = document.getElementById('plan-encart');
  if (encart) {
    encart.appendChild(el('h2', null, 'Le plan — l’ordre décidé du travail'));
    var rappel = el('p', 'rappel');
    rappel.appendChild(document.createTextNode('En clair : le '));
    rappel.appendChild(el('b', null, 'backlog'));
    rappel.appendChild(document.createTextNode(' liste tout le stock, trié par priorité. Le '));
    rappel.appendChild(el('b', null, 'plan'));
    rappel.appendChild(document.createTextNode(' (ci-dessous) est l’ordre décidé à la main, section par section. Le '));
    rappel.appendChild(el('b', null, 'prochain sprint'));
    rappel.appendChild(document.createTextNode(' pioche la première fiche todo + ready du plan.'));
    encart.appendChild(rappel);

    var signal = el('div', 'signal');
    var l1 = el('div', 'ligne-signal');
    l1.appendChild(el('span', 'lab', 'Prochaine fiche tirable'));
    l1.appendChild(plan.head ? miniCarte(plan.head) : el('span', 'rien', 'aucune — aucune fiche todo + ready dans l’ordre du plan'));
    signal.appendChild(l1);

    var l2 = el('div', 'ligne-signal');
    l2.appendChild(el('span', 'lab', 'À groomer avant elle'));
    if (plan.blockedAhead && plan.blockedAhead.length) {
      plan.blockedAhead.forEach(function (c) { l2.appendChild(miniCarte(c)); });
    } else {
      l2.appendChild(el('span', 'rien', '— rien ne bloque la tête'));
    }
    signal.appendChild(l2);

    if (plan.unresolved && plan.unresolved.length) {
      var l3 = el('div', 'ligne-signal');
      l3.appendChild(el('span', 'lab', 'Ids du plan introuvables'));
      l3.appendChild(el('span', 'rien', plan.unresolved.join(', ')));
      signal.appendChild(l3);
    }
    encart.appendChild(signal);
  }

  // --- Couloirs (une section de PLAN.md = un couloir) ---
  var couloirs = document.getElementById('plan-couloirs');
  (plan.lanes || []).forEach(function (lane) {
    var sec = el('section', 'couloir');
    sec.appendChild(el('h3', null, lane.label));
    var nCards = 0, nShipped = 0;
    lane.rows.forEach(function (row) {
      row.cards.forEach(function (c) { nCards++; if (c.found && c.closed) nShipped++; });
    });
    sec.appendChild(el('div', 'compte', lane.rows.length + ' entrée(s) · ' + nCards + ' fiche(s)' + (nShipped ? ' · ' + nShipped + ' livrée(s)' : '')));
    lane.rows.forEach(function (row) {
      var toutLivre = row.cards.length > 0 && row.cards.every(function (c) { return c.found && c.closed; });
      var ligne = el('div', 'plan-ligne' + (toutLivre ? ' tout-livre' : ''));
      var intention = el('p', 'intention');
      if (row.marker) intention.appendChild(el('span', 'mk', row.marker));
      intention.appendChild(document.createTextNode(cleanText(row.text)));
      ligne.appendChild(intention);
      var grille = el('div', 'grille');
      row.cards.forEach(function (c) { grille.appendChild(planCarte(c)); });
      ligne.appendChild(grille);
      sec.appendChild(ligne);
    });
    couloirs.appendChild(sec);
  });
  if (!(plan.lanes && plan.lanes.length)) {
    couloirs.appendChild(el('div', 'plan-vide', 'PLAN.md ne contient aucune entrée — lance `pnpm --dir products/mega-city plan-view:regen`.'));
  }

  var cpt = document.getElementById('plan-compteur');
  var cc = plan.counts || {};
  if (cpt) {
    cpt.textContent = (cc.entries || 0) + ' entrée(s) · ' + (cc.resolved || 0) + ' fiche(s) résolue(s) · ' +
      (cc.shipped || 0) + ' livrée(s) · ' + (cc.unresolved || 0) + ' introuvable(s).';
  }

  // --- Masquer/afficher les livrées ---
  var hide = document.getElementById('plan-hide-shipped');
  if (hide) {
    hide.addEventListener('change', function () {
      panPlan.classList.toggle('masquer-livrees', hide.checked);
    });
  }
})();
</script>

<script>
// Encart « ce qui a bougé » (fiche 20260828165644386) : rend window.EZK_PLAN_DELTA,
// compilé depuis features/PLAN.md + les fiches. Même discipline anti-XSS que le board :
// DOM par éléments + textContent, JAMAIS innerHTML sur du texte de fiche.
(function () {
  var delta = window.EZK_PLAN_DELTA || { recent: [], offPlanCount: 0, n: 0 };
  var box = document.getElementById('plan-delta-encart');
  if (!box) return;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function slug(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9_-]/g, '-'); }
  function prioVar(p) { return 'var(--p' + slug(p ? String(p).replace('P', '') : '3') + ')'; }

  box.appendChild(el('h2', null, 'Ce qui a bougé depuis le plan'));

  var cpt = el('p', 'delta-compteur');
  cpt.appendChild(document.createTextNode('Hors plan : '));
  cpt.appendChild(el('b', null, String(delta.offPlanCount)));
  cpt.appendChild(document.createTextNode(' fiche(s) active(s) (idées non comptées). Ci-dessous, les ' + (delta.n || 0) + ' dernières créées :'));
  box.appendChild(cpt);

  var liste = el('div', 'delta-liste');
  (delta.recent || []).forEach(function (c) {
    var item = el('div', 'delta-item');
    var a = document.createElement('a');
    a.className = 'mini';
    a.href = '../../' + c.file;
    a.style.setProperty('--prio-color', prioVar(c.priority));
    a.appendChild(el('span', 'id', c.id));
    a.appendChild(el('span', 't', c.title));
    item.appendChild(a);
    item.appendChild(el('span', 'delta-badge ' + (c.inPlan ? 'dans' : 'hors'), c.inPlan ? 'dans le plan' : 'hors plan'));
    item.appendChild(el('span', 'st', c.priority || '—'));
    item.appendChild(el('span', 'st', c.status));
    liste.appendChild(item);
  });
  if (!(delta.recent && delta.recent.length)) {
    liste.appendChild(el('span', 'rien', 'Aucune fiche active récente.'));
  }
  box.appendChild(liste);
})();
</script>
