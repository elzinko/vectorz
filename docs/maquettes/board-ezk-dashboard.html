<title>Board ezk</title>

<style>

let TLFILTER="all",TLVER="all",TLSHOWN=BATCH,QUERY="",FVER="all",FSORT="prio",FMODE="status",FCAT={avenir:true,encours:true,realisees:false};
let LOTVER="",LOTMODE="list",CADMSG="",DEVLOT="",PROCSTEP="",LAUNCH={groom:"auto",sprint:"auto",retro:"à la fin"},LAUNCHED=false;
const $=s=>document.querySelector(s),main=$("#main");
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const costTag=(c,tok)=>tok?`<span class="costtag ${c==='hi'?'hi':c==='mid'?'mid':'lo'}" title="${tok} tokens">${c==='hi'?'lourd':c==='mid'?'moyen':'léger'} · ${tok}</span>`:"";
const groomed=v=>v?(v.done+v.wip+v.ready):0;
const liveRuns=d=>Object.values(d.runs||{}).filter(r=>r.live);
function svKey(v){const m=(v||"").replace(/^v/i,"").match(/^(\d+)\.(\d+)(?:\.(\d+))?/);return m?[+m[1],+m[2],+(m[3]||0)]:[9999,9999,9999];}
function svCmp(a,b){const ka=svKey(a),kb=svKey(b);for(let i=0;i<3;i++){if(ka[i]!==kb[i])return ka[i]-kb[i];}return (a||"~").localeCompare(b||"~");}
function gaugeGroom(v,live){const t=v.total||1,g=groomed(v),p=(g/t*100).toFixed(1)+"%";return `<div class="gauge"><div class="gh"><span class="gl"><span class="sw" style="background:var(--groom)"></span>Cadrage — grooming ${live?'<span class="enc"><span class="live"></span>en cours</span>':''}</span><span class="gn">${g} / ${t} prêtes</span></div><div class="track"><i class="fill-groom" style="width:${p}"></i></div></div>`;}
function gaugeDev(v,live){const t=v.total||1,p=(v.done/t*100).toFixed(1)+"%";return `<div class="gauge"><div class="gh"><span class="gl"><span class="sw" style="background:var(--go)"></span>Réalisation — dev ${live?'<span class="enc"><span class="live"></span>en cours</span>':''}</span><span class="gn">${v.done} / ${t} livrées</span></div><div class="track"><i class="fill-dev" style="width:${p}"></i></div></div>`;}
function twoGauge(v,lk,showDev){return `<div class="gauges">${gaugeGroom(v,lk==='cadrage')}${showDev?gaugeDev(v,lk==='dev'):''}</div>`;}
const fRowL=f=>`<div class="fli clk" data-f="${f.id}"><span class="prio ${f.prio}">${f.prio}</span><span class="stat s-${f.status}">${STLABEL[f.status][2]}</span><span class="fn">${esc(f.title)}</span><span class="pill ver" style="${f.ver?'':'visibility:hidden'}">${f.ver||'—'}</span><span class="faint">›</span></div>`;
const allVersions=d=>{const V=d.versions,o=[];if(V.current)o.push(V.current.ver);V.upcoming.forEach(v=>o.push(v.ver));V.past.forEach(v=>o.push(v.ver));return o;};
const findVer=(d,ver)=>{const V=d.versions;if(V.current&&V.current.ver===ver)return V.current;return V.upcoming.concat(V.past).find(x=>x.ver===ver);};
const isCurVer=(d,ver)=>d.versions.current&&d.versions.current.ver===ver;
const verCat=(d,ver)=>{const V=d.versions;if(V.past.some(x=>x.ver===ver))return"realisees";if(V.current&&V.current.ver===ver)return"encours";if(V.upcoming.some(x=>x.ver===ver))return"avenir";return null;};
const isPastVer=(d,ver)=>d.versions.past.some(x=>x.ver===ver);


function devTable(d){const V=d.versions,all=(V.current?[V.current]:[]).concat(V.upcoming,V.past),cadre=v=>groomed(v)===v.total;
  const avenir=all.filter(v=>cadre(v)&&v.done===0&&v.total>0),encours=all.filter(v=>v.done>0&&v.done<v.total),faits=all.filter(v=>v.total>0&&v.done===v.total);
  const gauge=v=>`<div class="gmini"><span class="gl">dev</span><span class="minibar2"><i class="fill-dev" style="width:${(v.done/(v.total||1)*100).toFixed(0)}%"></i></span><span class="gv">${v.done}/${v.total}</span></div>`;
  const row=(v,launch)=>`<div class="lotmini clk" data-ref='${JSON.stringify({type:"version",ver:v.ver})}'><div class="lmn"><span class="pill ver">${v.ver}</span><span class="lmt">${esc(v.name)}</span></div><div class="lmg">${launch?`<button class="btn sm" data-devlot="${v.ver}">▸ Lancer</button>`:gauge(v)}</div></div>`;
  const col=(t,a,launch)=>`<div class="lotcol"><h4>${t} <span class="cnt">${a.length}</span></h4>${a.length?a.map(v=>row(v,launch)).join(""):'<div class="lotmini"><span class="muted" style="padding:2px 0">—</span><span></span></div>'}</div>`;
  return `<section class="lotcols">${col("À venir — à développer",avenir,true)}${col("En cours",encours,false)}${col("Développé",faits,false)}</section>`;}
function procTable(d){const V=d.versions,all=(V.current?[V.current]:[]).concat(V.upcoming,V.past).slice().sort((a,b)=>svCmp(b.ver,a.ver)),cadre=v=>groomed(v)===v.total,past=v=>V.past.some(x=>x.ver===v.ver);
  const bar=(cls,frac,tot)=>`<span class="minibar"><i class="${cls}" style="width:${(frac/(tot||1)*100).toFixed(0)}%"></i></span> ${frac}/${tot}`;
  const runByVer={};liveRuns(d).forEach(r=>{runByVer[r.ver]=r;});
  const act=v=>{const lr=runByVer[v.ver];if(lr)return `<button class="btn sm" data-ref='${JSON.stringify({type:"run",id:lr.id})}'>Voir le run</button>`;if(cadre(v)&&v.done<v.total&&v.total>0)return `<button class="btn sm" data-devlot="${v.ver}">▸ Lancer</button>`;return '';};
  return `<section class="card"><h3>Versions dans le process <span class="sub" style="text-transform:none;letter-spacing:0">où en est chaque version · ligne verte = en run · clique pour le détail</span></h3>
   <div class="ptrow hd"><span>Version</span><span>Cadrage</span><span>Développement</span><span>Versionné</span><span></span></div>
   ${all.map(v=>{const lr=runByVer[v.ver];return `<div class="ptrow clk${lr?' run':''}" data-ref='${JSON.stringify({type:"version",ver:v.ver})}'><span class="ptn"><span class="pill ver">${v.ver}</span><span class="nm">${esc(v.name)}</span>${lr?'<span class="runbadge">● en run</span>':''}</span><span class="ptc">${bar('fill-groom',groomed(v),v.total)}</span><span class="ptc">${cadre(v)?bar('fill-dev',v.done,v.total):'<span class="faint">— pas cadré</span>'}</span><span class="ptc">${past(v)?'<span style="color:var(--go)">✓ taguée</span>':'<span class="faint">—</span>'}</span><span class="ptact">${act(v)}</span></div>`;}).join("")}</section>`;}
function viewOverview(d){const f=d.funnel,m=d.metrics;
  const tot=f.idea+f.ready+f.wip||1,p=x=>(x/tot*100).toFixed(1)+"%",ratio=f.idea?(f.ready/f.idea):0;
  return `<div class="vh"><h2>Vue d'ensemble — ${esc(d.name)}</h2><span class="sub">${esc(d.desc)}</span></div>

   <section class="funnel"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px"><b>Entonnoir — le pipeline actif</b><span class="sub">ratio prêtes / idées : <b style="color:var(--fg);font-family:var(--font-data)">${ratio.toFixed(2)}</b></span></div>
     <div class="funbar"><i class="fun-idea" style="width:${p(f.idea)}">${f.idea}</i><i class="fun-ready" style="width:${p(f.ready)}">${f.ready}</i><i class="fun-wip" style="width:${p(f.wip)}">${f.wip||''}</i></div>
     <div class="funlegend"><span><span class="sw" style="background:var(--idea)"></span>idées <b>${f.idea}</b></span><span><span class="sw" style="background:var(--groom)"></span>prêtes <b>${f.ready}</b></span><span><span class="sw" style="background:var(--warn)"></span>en cours <b>${f.wip}</b></span></div>
     <div class="funextra"><span>sans version : <b>${f.unversioned}</b></span><span>parkées : <b>${f.parked}</b></span></div></section>
   ${procTable(d)}`;}

function viewCadrage(d){const V=d.versions,all=(V.current?[V.current]:[]).concat(V.upcoming,V.past);
  const inDev=v=>v.done>0&&v.done<v.total,q=(x,t)=>(x/(t||1)*100).toFixed(0)+"%";

function viewFiches(d){const cols=["idea","ready","wip","done"],vers=["all"].concat(allVersions(d)).concat(["sans version"]);
  let list=Object.values(d.fiches);

  else if(FVER!=="all")list=list.filter(f=>f.ver===FVER);
  else{const sel=Object.keys(FCAT).filter(k=>FCAT[k]);list=list.filter(f=>{const c=verCat(d,f.ver);return c?sel.includes(c):true;});}

     <span class="seg"><button data-fm="status" class="${FMODE==='status'?'on':''}">Par statut</button><button data-fm="list" class="${FMODE==='list'?'on':''}">En ligne</button></span></div>

function detailFiche(d,fid){const f=d.fiches[fid];if(!f)return"<button class='back' data-back>‹ retour</button><p>introuvable</p>";

   <div><section class="card"><h3>Infos</h3><dl class="kv"><dt>id</dt><dd>${f.id}</dd><dt>associer à un lot</dt><dd><select data-assign="${f.id}">${vers.map(v=>`<option value="${v}" ${v===(f.ver||"")?'selected':''}>${v||'— sans version —'}</option>`).join("")}</select></dd><dt>statut</dt><dd>${STLABEL[f.status][2]}</dd>${f.split_from?`<dt>provenance</dt><dd>split de ${f.split_from}</dd>`:''}</dl></section></div></div></div>`;}
function detailRun(d,id){const r=(d.runs||{})[id];if(!r)return"<button class='back' data-back>‹ retour</button><p>introuvable</p>";
  const vc=r.verdict.startsWith("GO")?"v-go":r.verdict.startsWith("NO")?"v-stop":r.live?"v-go":"v-warn";
  const nSprint=(r.moments||[]).filter(m=>m.step==="sprint").length;

function detailSprint(d,id,n){const r=(d.runs||{})[id];const s=r&&(r.moments||[]).find(x=>x.step==="sprint"&&x.n==n);if(!s)return"<button class='back' data-back>‹ retour</button><p>introuvable</p>";
  const nf=(s.fiches||[]).length;
  const fiche=f=>{const ff=f.fid?d.fiches[f.fid]:null,t=ff?ff.title:f.t,vr=ff?ff.ver:f.ver;return `<div class="mfiche"${f.fid?` data-doc="fiche:${f.fid}"`:''}><span class="mft">${esc(t||'—')}</span><span class="pill ver">${vr||''}</span><span class="mtrans">${esc(f.from||'')} → ${esc(f.to||'')}</span></div>`;};
  return `<button class="back" data-back>‹ retour</button><div class="detail"><div class="dhead"><span class="kindtag">sprint</span><span class="verdict ${s.status==='done'?'v-go':'v-warn'}">${s.status?STLABEL[s.status][2]:'—'}</span><span class="pill ver">${r.ver}</span></div>
   <h2 style="font-size:23px">Sprint ${s.n} — ${esc(s.label)}</h2><div class="enclair"><b>Ce sprint.</b> ${nf} fiche${nf>1?'s':''}, dans le run « ${esc(r.name)} ».</div>
   <section class="metrics4"><div class="metric"><div class="mv">${nf}</div><div class="mk">fiches</div></div><div class="metric"><div class="mv">${s.tok||'—'}</div><div class="mk">tokens</div></div><div class="metric"><div class="mv">${s.status?STLABEL[s.status][2]:'—'}</div><div class="mk">statut</div></div><div class="metric"><div class="mv">${r.ver}</div><div class="mk">lot</div></div></section>
   <section class="card"><h3>Fiches du sprint <span class="sub" style="text-transform:none;letter-spacing:0">clique une fiche</span></h3>${nf?s.fiches.map(fiche).join(""):'<div class="mfiche"><span class="muted">—</span></div>'}</section>
   <section class="card"><h3>Dans le run</h3><div class="row clk" data-ref='${JSON.stringify({type:"run",id:r.id})}'><span></span><span class="ttl">${esc(r.name)}</span><span class="meta">${r.ver} · ${(r.moments||[]).length} étapes →</span></div></section></div>`;}
function detailRetro(d,i){const r=(d.retros||[])[i];if(!r)return"<button class='back' data-back>‹ retour</button><p>introuvable</p>";
  const devRun=Object.values(d.runs||{}).find(x=>x.ver===r.ver&&(x.moments||[]).some(m=>m.step==="sprint"));

   <div class="sec"><h4>Points</h4><ul class="crit">${r.pts.map(p=>`<li><span class="box" style="border-radius:50%"></span><span>${esc(p)}</span></li>`).join("")}</ul></div>
   ${r.fiches&&r.fiches.length?`<section class="card flist"><h3>Fiches créées par cette rétro</h3>${r.fiches.map(x=>d.fiches[x.id]?fRowL(d.fiches[x.id]):`<div class="fli"><span></span><span></span><span class="fn">${esc(x.id)} (${x.ver})</span><span></span><span></span></div>`).join("")}</section>`:''}

function detailVersion(d,ver){const v=findVer(d,ver),isCur=isCurVer(d,ver),isPast=isPastVer(d,ver),lr=liveRuns(d)[0],lk=(isCur&&lr)?lr.kind:null;

   ${CADMSG?`<div class="msg">⟳ Simulé : <code>${esc(CADMSG)}</code> (maquette)</div>`:''}

renderProjbtn();render();
document.addEventListener("click",e=>{
  const back=e.target.closest("[data-back]"),nav=e.target.closest("#nav button"),goto=e.target.closest("[data-goto]"),
    tl=e.target.closest("[data-tl]"),fm=e.target.closest("[data-fm]"),fcat=e.target.closest("[data-fcat]"),lm2=e.target.closest("[data-lm]"),f=e.target.closest("[data-f]"),rt=e.target.closest("[data-retro]"),
    ref=e.target.closest("[data-ref]"),lm=e.target.closest("#loadmore"),lk=e.target.closest("[data-lk]"),go=e.target.closest("#go"),
    cad=e.target.closest("[data-cad]"),devlot=e.target.closest("[data-devlot]"),devcancel=e.target.closest("#devcancel"),step=e.target.closest("[data-step]"),
    pbtn=e.target.closest("#projbtn"),pm=e.target.closest("[data-pm]"),pmx=e.target.closest("#pmx"),modalbg=e.target.closest("#projmodal");
  const _doc=e.target.closest("[data-doc]");
  if(e.target.closest("#docx")||e.target.id==="docmodal"){closeDoc();return;}
  if(e.target.closest("#docback")){docBack();return;}
  const _gofiche=e.target.closest("[data-gofiche]");if(_gofiche){closeDoc();openDetail({type:"fiche",fid:_gofiche.dataset.gofiche});return;}
  if(_doc){openDoc(_doc.dataset.doc);return;}
  if(pbtn){openModal();return;}
  if(pm){CUR=pm.dataset.pm;DETAIL=null;FVER="all";TLVER="all";DEVLOT="";$("#projmodal").hidden=true;renderProjbtn();setSection("overview");return;}
  if(pmx||(modalbg&&e.target===modalbg)){$("#projmodal").hidden=true;return;}
  if(cad){CADMSG=cad.dataset.cad;const dd=e.target.closest("details.cmd");if(dd)dd.open=false;render();return;}
  if(back){goBack();return;}
  if(nav){setSection(nav.dataset.s);return;}
  if(goto){e.preventDefault();if(goto.dataset.tlf){TLFILTER=goto.dataset.tlf;TLSHOWN=BATCH;}setSection(goto.dataset.goto);return;}
  if(lm){TLSHOWN+=BATCH;render();return;}
  if(tl){TLFILTER=tl.dataset.tl;TLSHOWN=BATCH;render();return;}
  if(fm){FMODE=fm.dataset.fm;render();return;}
  if(fcat){FCAT[fcat.dataset.fcat]=!FCAT[fcat.dataset.fcat];render();return;}
  if(lm2){LOTMODE=lm2.dataset.lm;render();return;}
  if(devlot){DEVLOT=devlot.dataset.devlot;LAUNCHED=false;setSection("dev");return;}
  if(devcancel){DEVLOT="";LAUNCHED=false;render();return;}
  if(lk){LAUNCH[lk.dataset.lk]=lk.dataset.lv;LAUNCHED=false;render();return;}
  if(go){LAUNCHED=true;render();return;}
  if(step){PROCSTEP=(PROCSTEP===step.dataset.step?"":step.dataset.step);render();return;}
  if(f){openDetail({type:"fiche",fid:f.dataset.f});return;}
  if(rt){openDetail({type:"retro",i:+rt.dataset.retro});return;}
  if(ref){try{openDetail(JSON.parse(ref.dataset.ref));}catch(e){}return;}
});
document.addEventListener("change",e=>{
  if(e.target.id==="fversel"){FVER=e.target.value;render();}
  else if(e.target.id==="fsort"){FSORT=e.target.value;render();}
  else if(e.target.id==="tlversel"){TLVER=e.target.value;TLSHOWN=BATCH;render();}
  else if(e.target.dataset&&e.target.dataset.assign){const f=DATA[CUR].fiches[e.target.dataset.assign];if(f){f.ver=e.target.value;render();}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#docmodal").hidden){closeDoc();return;}$("#projmodal").hidden=true;}});
$("#gsearch").addEventListener("input",e=>{QUERY=e.target.value.toLowerCase();TLSHOWN=BATCH;if(DETAIL)DETAIL=null;if(SECTION!=="timeline"&&SECTION!=="fiches")setSection("fiches");else render();$("#gsearch").focus();});
</script>
