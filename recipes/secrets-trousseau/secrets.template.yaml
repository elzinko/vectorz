# secrets.template.yaml — GABARIT. Copie-le en « secrets.yaml » à la racine d'un
# projet, puis remplis-le. Recette : voir README.md (CLI `ezk-secret`) et la fiche
# vectorz « ezk-secret sync » (20261001104806732).
#
# But : déclarer les secrets et variables d'un projet pour que l'agent (LLM) les
# PROVISIONNE avec `ezk-secret`, SANS jamais voir leurs valeurs.
#
# Principe — une SOURCE, plusieurs destinations :
#   - Le trousseau macOS (via `ezk-secret`) est la source UNIQUE des valeurs.
#   - Ce fichier ne contient que des NOMS et des RÔLES — jamais de valeur sensible.
#     Il est versionné : il voyage donc dans CHAQUE worktree, tout seul.
#   - `ezk-secret sync` lit ce fichier, prend chaque valeur au trousseau (tu
#     autorises par Touch ID) et la POUSSE vers ses destinations, à l'aveugle.
#
# Destinations possibles (champ `to`) :
#   github         secret GitHub Actions (CI)
#   vercel:<env>   variable Vercel — env = production | preview | development
#   local          écrit/met à jour le .env (gitignoré) de CE worktree, pour le dev
#   (aucune)       vit seulement au trousseau : lu à la demande, rien à pousser
#
# Champs d'une entrée :
#   role   : à quoi sert la valeur                              (obligatoire)
#   to     : destinations à approvisionner                     (voir ci-dessus)
#   kind   : secret (défaut) | variable                        (optionnel)
#   value  : valeur en clair, UNIQUEMENT si NON sensible       (sinon → trousseau)
#   from   : nom au trousseau si différent de la règle         (optionnel)
#
# Nom au trousseau : par défaut « <project>-<nom-en-kebab> »
#   ex. (projet « monapp »)  API_KEY  ->  monapp-api-key
# GITHUB_TOKEN ne se déclare pas : GitHub le fournit automatiquement.

project: <nom-du-projet>

secrets:

  # Secret poussé vers la CI GitHub.
  EXEMPLE_API_KEY:
    role: "<à quoi sert cette clé>"
    to: [github]

  # Secret utile en CI ET en dev local : ezk-secret le met aussi dans le .env.
  EXEMPLE_DB_URL:
    role: "<chaîne de connexion>"
    to: [github, local]

  # Valeur NON sensible (variable) — valeur en clair autorisée dans ce fichier.
  EXEMPLE_PROJECT_ID:
    role: "<identifiant public>"
    kind: variable
    value: "<valeur publique>"
    to: [github]

  # Variable d'exécution côté Vercel (+ dev local).
  EXEMPLE_PUBLIC_URL:
    role: "<URL publique lue par le site>"
    to: [vercel:production, local]

  # Secret lu seulement en local : aucune destination à pousser.
  # Ajoute `from` si le nom au trousseau ne suit pas la règle par défaut.
  EXEMPLE_LOCAL_ONLY:
    role: "<clé lue par un script local>"
    from: <nom-exact-au-trousseau>
